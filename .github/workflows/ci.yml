name: Genia Link CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-self-tests:
    name: Build, analyzers and self-tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve compatibility baseline bytes
        shell: pwsh
        run: |
          $paths = @(
            'src/GeniaLink.Core/Discovery/DiscoveryPacket.cs',
            'src/GeniaLink.Core/Pairing/PairingProtocol.cs',
            'src/GeniaLink.Core/Network/TrustedSessionHandshake.cs',
            'src/GeniaLink.Core/Network/TransferProtocol.cs'
          )

          foreach ($path in $paths) {
            [byte[]]$bytes = [System.IO.File]::ReadAllBytes($path)
            $normalized = [System.Collections.Generic.List[byte]]::new($bytes.Length)
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 13 -and ($i + 1) -lt $bytes.Length -and $bytes[$i + 1] -eq 10) {
                $normalized.Add([byte]10)
                $i++
              }
              else {
                $normalized.Add($bytes[$i])
              }
            }
            [System.IO.File]::WriteAllBytes($path, $normalized.ToArray())
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET environment
        shell: pwsh
        run: dotnet --info

      - name: Run Genia Link security checks
        shell: pwsh
        run: ./scripts/SecurityCheck.ps1
